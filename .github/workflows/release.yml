name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # oldest supported — the artifact must run there
      - run: make pyz
      - name: smoke test
        run: |
          python3 dist/collective.pyz --help
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/collective.pyz
